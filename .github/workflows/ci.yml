name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional existing release tag to attach AudioProfileSwitcher.exe to (e.g. v1.2.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build solution (warnings as errors)
        run: dotnet build AudioProfileSwitcher.sln -c Release -warnaserror

      - name: Run unit tests
        run: dotnet test AudioProfileSwitcher.sln -c Release --no-build --verbosity normal

      - name: Publish single-file EXE
        run: dotnet publish AudioProfileSwitcher.csproj -c Release -r win-x64 --no-self-contained -p:PublishSingleFile=true -o publish

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioProfileSwitcher-win-x64
          path: publish/AudioProfileSwitcher.exe

      - name: Attach EXE to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          TAG="${INPUT_TAG:-${EVENT_TAG:-$REF_NAME}}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" publish/AudioProfileSwitcher.exe --clobber
          else
            gh release create "$TAG" publish/AudioProfileSwitcher.exe --title "AudioProfileSwitcher $TAG" --notes "Optimizations and QoL updates"
          fi
