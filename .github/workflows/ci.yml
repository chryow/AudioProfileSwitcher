name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional existing release tag to attach EXEs to (e.g. v1.4.1)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: Build solution (warnings as errors)
        run: dotnet build AudioProfileSwitcher.sln -c Release -warnaserror

      - name: Run unit tests
        run: dotnet test AudioProfileSwitcher.sln -c Release --no-build --verbosity normal

      - name: Publish lightweight single-file EXE (framework-dependent)
        run: dotnet publish AudioProfileSwitcher.csproj -c Release -r win-x64 --no-self-contained -p:PublishSingleFile=true -o publish

      - name: Publish standalone single-file EXE (self-contained)
        shell: bash
        run: |
          dotnet publish AudioProfileSwitcher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish-standalone
          mv publish-standalone/AudioProfileSwitcher.exe publish/AudioProfileSwitcher-standalone.exe

      - name: Upload EXE Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AudioProfileSwitcher-win-x64
          path: |
            publish/AudioProfileSwitcher.exe
            publish/AudioProfileSwitcher-standalone.exe

  attach-release:
    needs: build-and-test
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built EXE artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: AudioProfileSwitcher-win-x64
          path: publish

      - name: Attach EXEs to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-${EVENT_TAG:-$REF_NAME}}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag format: $TAG" >&2
            exit 1
          fi
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" publish/AudioProfileSwitcher.exe publish/AudioProfileSwitcher-standalone.exe -R "$REPO" --clobber
          else
            gh release create "$TAG" publish/AudioProfileSwitcher.exe publish/AudioProfileSwitcher-standalone.exe -R "$REPO" --title "AudioProfileSwitcher $TAG" --notes "Release $TAG"
          fi
