name: Bug Report
description: Report a crash, audio switching issue, or unexpected behavior.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue! Including your version and `app.log` helps us fix it fast.

  - type: input
    id: version
    attributes:
      label: App Version & Build Type
      placeholder: "e.g., v1.5.1 (AudioProfileSwitcher.exe or AudioProfileSwitcher-standalone.exe)"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Windows Version
      options:
        - Windows 11
        - Windows 10
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the issue and the audio devices involved (e.g., USB mic, wireless/Bluetooth headset, speakers).
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start on card A (External Mic + Speakers)
        2. Press hotkey / click card B
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines (optional)
      description: Open **Settings → Open Log File** (`%AppData%\AudioProfileSwitcher\app.log`) and paste the last ~30 lines if available.
      render: text
